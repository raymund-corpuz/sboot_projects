spring.application.name=studentmanagement

#H2 in-memory database
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.username=sa
spring.datasource.password=

#JPA/ Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


app.security.jwt.issuer=student-management
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d

