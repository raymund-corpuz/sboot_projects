spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student}

#Flyway builds the schema; Hibernate only checks it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.h2.console.enabled=false
